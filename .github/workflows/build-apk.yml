name: Build Splitwise P2P Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || yes | "$ANDROID_HOME/tools/bin/sdkmanager" --licenses 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Generate Release Keystore
        run: |
          cd android-app/app
          rm -f splitwise-release.keystore
          keytool -genkeypair -v \
            -keystore splitwise-release.keystore \
            -alias splitwise \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storetype PKCS12 \
            -dname "CN=Splitwise P2P, OU=Mesh Network, O=Splitwise P2P, C=US" \
            -storepass splitwise123 \
            -keypass splitwise123
          cp splitwise-release.keystore ../splitwise-release.keystore 2>/dev/null || true

      - name: Build Release APK
        run: |
          cd android-app
          gradle assembleRelease --stacktrace

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Splitwise-P2P-Release-APK
          path: |
            android-app/app/build/outputs/apk/release/*.apk
            android-app/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Prepare Release Asset
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p release-assets
          cp android-app/app/build/outputs/apk/release/*.apk release-assets/SplitwiseP2P.apk || true

      - name: Publish GitHub Release (In-App Auto-Update Distribution)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest
          name: "Splitwise P2P — Latest Release"
          body: |
            ### 🚀 Splitwise P2P Release
            - **Direct APK download** for seamless in-app auto-updates.
            - Includes Activity feed tab, Offline Mesh Sync, Google Quick Share, ML Kit Scanner, and INR support.
            - **Commit**: ${{ github.sha }}
          files: release-assets/SplitwiseP2P.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
