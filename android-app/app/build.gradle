plugins {
    id 'com.android.application'
}

android {
    namespace 'com.splitwise.p2p'
    compileSdk 34

    defaultConfig {
        applicationId "com.splitwise.p2p"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file("splitwise-release.keystore")
            storePassword "splitwise123"
            keyAlias "splitwise"
            keyPassword "splitwise123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Zero heavy external dependencies needed — uses native Android SQLite, NsdManager, and WebView!
}
