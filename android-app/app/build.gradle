plugins {
    id 'com.android.application'
}

android {
    namespace 'com.splitwise.p2p'
    compileSdk 34

    defaultConfig {
        applicationId "com.splitwise.p2p"
        minSdk 23
        targetSdk 34
        versionCode ((int) (System.currentTimeMillis() / 1000))
        versionName "1.2.0"
    }

    signingConfigs {
        release {
            def permKeystore = file("splitwise-permanent.keystore")
            if (permKeystore.exists()) {
                file("splitwise-release.keystore").bytes = permKeystore.bytes
            }
            if (file("splitwise-release.keystore").exists()) {
                storeFile file("splitwise-release.keystore")
                storePassword "splitwise123"
                keyAlias "splitwise"
                keyPassword "splitwise123"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (file("splitwise-release.keystore").exists()) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            if (file("splitwise-release.keystore").exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Google Nearby Connections (Offline BLE + Wi-Fi Direct Mesh Sync like Quick Share)
    implementation 'com.google.android.gms:play-services-nearby:19.3.0'

    // Google Code Scanner (High-speed on-device QR scanning with zero camera permission hassle)
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
